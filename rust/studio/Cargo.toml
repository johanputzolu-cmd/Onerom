[package]
name = "onerom-studio"
version = "0.1.0"
edition = "2024"
authors = ["Piers Finlayson <piers@piers.rocks>"]
license = "MIT"
description = "One ROM Studio - GUI for managing One ROM - the flexible retro ROM replacement"
repository = "https://github.com/piersfinlayson/one-rom"
homepage = "https://onerom.org"
documentation = "https://docs.rs/onerom-gen"
keywords = ["retro", "rom", "commodore", "embedded"]
categories = ["embedded", "hardware-support"]

[[bin]]
name = "onerom-studio"
path = "src/main.rs"

[dependencies]
onerom-config = { path = "../config", version = "0.2.1" }
onerom-fw = { path = "../fw", version = "0.1.0" }
onerom-gen = { version = "0.1.1" }
sdrr-fw-parser = { path = "../sdrr-fw-parser", version = "0.5.3" }

chrono = "0.4"
iced_web = "0.4"
iced = { version = "0.13", features = ["tokio", "image"] }
log = "0.4"
open = "5.3"
probe-rs = { version = "0.29", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
rfd = "0.15"