[package]
name = "onerom-config"
version = "0.1.0"
edition = "2021"
authors = ["Piers Finlayson <piers@piers.rocks>"]
license = "MIT"
description = "ROM type configurations for One ROM - the flexible retro ROM replacement"
repository = "https://github.com/piersfinlayson/one-rom"
homepage = "https://onerom.org"
documentation = "https://docs.rs/onerom-config"
keywords = ["retro", "rom", "commodore", "embedded"]
categories = ["embedded", "hardware-support"]
build = "build/main.rs"

[dependencies]
# No runtime dependencies - everything is const generated code

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"